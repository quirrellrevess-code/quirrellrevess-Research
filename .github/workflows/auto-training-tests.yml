name: Auto-training offline tests

on:
  push:
    branches:
      - feature/auto-training-plugin
      - "analysis/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m py_compile components/legendai_stdout_bridge.py components/legendai_action_guard.py components/test_legendai_stdout_bridge.py components/test_legendai_action_guard.py components/pc_turn_controller.py components/test_pc_turn_controller.py components/pc_observation_sequence.py components/test_pc_observation_sequence.py components/pc_observation_adapter.py components/test_pc_observation_adapter.py components/pc_state_normalizer.py components/test_pc_state_normalizer.py components/pc_capture_alignment.py components/test_pc_capture_alignment.py components/pc_capture_envelope.py components/test_pc_capture_envelope.py components/pc_live_screen_stream.py components/test_pc_live_screen_stream.py components/pc_window_probe.py components/test_pc_window_probe.py components/test_pc_postconditions.py components/pc_phase_evidence.py components/test_pc_phase_evidence.py components/pc_screen_observer.py components/test_pc_screen_observer.py components/pc_window_capture.py components/test_pc_window_capture.py components/pc_target_observer.py components/test_pc_target_observer.py components/pc_action_target_mapping.py components/test_pc_action_target_mapping.py components/pc_action_preview.py components/test_pc_action_preview.py components/test_pc_action_preview_cli.py components/observation_replay_report.py components/test_observation_replay_report.py

      - name: Run offline unit tests
        working-directory: components
        run: python -m unittest -v test_legendai_stdout_bridge test_legendai_action_guard test_pc_turn_controller test_pc_observation_sequence test_pc_observation_adapter test_pc_state_normalizer test_pc_capture_alignment test_pc_capture_envelope test_pc_live_screen_stream test_pc_window_probe test_pc_postconditions test_pc_phase_evidence test_pc_screen_observer test_pc_window_capture test_pc_target_observer test_pc_action_target_mapping test_pc_action_preview test_pc_action_preview_cli test_observation_replay_report

  airredirector-patch-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fetch pinned upstream source and validate patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/airredirector"
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/URA-Plugins/AIRedirector/6e31c415e5774aaab3d5203432f5133c41e47b57/Class1.cs" \
            -o "$RUNNER_TEMP/airredirector/Class1.cs"
          test -s "$RUNNER_TEMP/airredirector/Class1.cs"
          cd "$RUNNER_TEMP/airredirector"
          git init -q
          git add Class1.cs
          git -c user.name=CI -c user.email=ci@example.invalid commit -qm "Pinned AIRedirector source"
          PATCH="$GITHUB_WORKSPACE/components/AIRedirectorIntegration/patches/0001-passive-recommendation-sink.patch"
          git apply --check --verbose "$PATCH"
          git apply "$PATCH"
          git diff --check
          grep -Fq 'recommendationSink.TryRecord(output.Line)' Class1.cs
          grep -Fq 'recommendationSink.SetTarget(null, null)' Class1.cs
          grep -Fq 'Capture(recommendationSink.Dispose)' Class1.cs
          test -s "$GITHUB_WORKSPACE/components/AIRedirectorIntegration/LegendAiRecommendationSink.cs"
          grep -Fq 'MaxRecommendationLineChars' "$GITHUB_WORKSPACE/components/AIRedirectorIntegration/LegendAiRecommendationSink.cs"

  recommendation-sink-dotnet-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Compile passive recommendation sink and run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sink-smoke"
          cp components/AIRedirectorIntegration/LegendAiRecommendationSink.cs "$RUNNER_TEMP/sink-smoke/"
          cat > "$RUNNER_TEMP/sink-smoke/SinkSmoke.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          EOF
          cat > "$RUNNER_TEMP/sink-smoke/Program.cs" <<'EOF'
          using System.Text.Json;
          using UmaAutoTraining.AIRedirectorIntegration;

          var root = Path.Combine(Path.GetTempPath(), "sink-smoke-" + Guid.NewGuid().ToString("N"));
          try
          {
              using (var sink = new LegendAiRecommendationSink(root))
              {
                  sink.SetTarget(123, 17);
                  if (sink.TryRecord("not a recommendation"))
                      throw new Exception("Non-recommendation accepted");
                  if (!sink.TryRecord("AI建议：训练速度"))
                      throw new Exception("Recommendation rejected");
                  if (sink.TryRecord("AI建议：\n训练速度") ||
                      sink.TryRecord("AI建议：训练速度\nAI建议：休息") ||
                      sink.TryRecord("AI建议：训练速度\r\n"))
                      throw new Exception("Multi-line recommendation accepted");
                  const string prefix = "AI建议：";
                  var atLimit = prefix + new string('x', 4096 - prefix.Length);
                  if (!sink.TryRecord(atLimit))
                      throw new Exception("Exact-limit recommendation rejected");
                  if (sink.TryRecord(atLimit + "x"))
                      throw new Exception("Over-limit recommendation accepted");
                  var emoji = char.ConvertFromUtf32(0x1F600);
                  var unicodeAtLimit = prefix + string.Concat(Enumerable.Repeat(emoji, 2045)) + "x";
                  if (unicodeAtLimit.Length != 4096 || !sink.TryRecord(unicodeAtLimit))
                      throw new Exception("Exact UTF-16-unit-limit recommendation rejected");
                  var unicodeOverLimit = prefix + string.Concat(Enumerable.Repeat(emoji, 2046));
                  if (unicodeOverLimit.Length != 4097 || sink.TryRecord(unicodeOverLimit))
                      throw new Exception("Over-limit UTF-16-unit recommendation accepted");
                  sink.SetTarget(null, null);
                  if (!sink.TryRecord("AI建议: 休息"))
                      throw new Exception("Recommendation rejected after clear");
              }
              var lines = File.ReadAllLines(Path.Combine(root, "legendai-recommendations.jsonl"));
              if (lines.Length != 4) throw new Exception("Unexpected record count");
              using var first = JsonDocument.Parse(lines[0]);
              using var second = JsonDocument.Parse(lines[1]);
              using var third = JsonDocument.Parse(lines[2]);
              using var fourth = JsonDocument.Parse(lines[3]);
              if (first.RootElement.GetProperty("single_mode_chara_id").GetInt32() != 123 ||
                  first.RootElement.GetProperty("turn").GetInt32() != 17 ||
                  first.RootElement.GetProperty("turn_association_status").GetString() != "target_context_available_unverified" ||
                  first.RootElement.GetProperty("category").GetString() != "training" ||
                  first.RootElement.GetProperty("verified").GetBoolean() ||
                  first.RootElement.GetProperty("executable").GetBoolean())
                  throw new Exception("First record did not match fail-closed contract");
              if (second.RootElement.GetProperty("raw_line").GetString()?.Length != 4096 ||
                  second.RootElement.GetProperty("verified").GetBoolean() ||
                  second.RootElement.GetProperty("executable").GetBoolean())
                  throw new Exception("Exact-limit record violated the passive sink contract");
              if (third.RootElement.GetProperty("raw_line").GetString()?.Length != 4096 ||
                  third.RootElement.GetProperty("verified").GetBoolean() ||
                  third.RootElement.GetProperty("executable").GetBoolean())
                  throw new Exception("Unicode exact-limit record violated the passive sink contract");
              if (fourth.RootElement.GetProperty("single_mode_chara_id").ValueKind != JsonValueKind.Null ||
                  fourth.RootElement.GetProperty("turn").ValueKind != JsonValueKind.Null ||
                  fourth.RootElement.GetProperty("turn_association_status").GetString() != "unavailable_in_airredirector_context" ||
                  fourth.RootElement.GetProperty("category").GetString() != "named_action")
                  throw new Exception("Cleared target leaked stale context");
              var blockedRoot = Path.Combine(Path.GetTempPath(), "sink-blocked-" + Guid.NewGuid().ToString("N"));
          File.WriteAllText(blockedRoot, "not a directory");
          try
          {
              using var blockedSink = new LegendAiRecommendationSink(blockedRoot);
              blockedSink.SetTarget(1, 1);
              if (blockedSink.TryRecord("AI建议：训练速度"))
                  throw new Exception("Unavailable telemetry path should not report success");
          }
          finally
          {
              File.Delete(blockedRoot);
          }
          Console.WriteLine("PASS: C# sink compiled, recorded non-executable output, cleared target, tolerated I/O failure");
          }
          finally
          {
              if (Directory.Exists(root)) Directory.Delete(root, recursive: true);
          }
          EOF
          dotnet run --project "$RUNNER_TEMP/sink-smoke/SinkSmoke.csproj" --configuration Release
