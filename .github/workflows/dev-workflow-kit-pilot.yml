name: Dev Workflow Kit Python consumer pilot

on:
  push:
    branches:
      - "analysis/**"

permissions:
  contents: read

jobs:
  acceptance:
    uses: wosafety0/dev-workflow-kit/.github/workflows/reusable-acceptance.yml@c44f77d6f2b0aae07689e6127b203e1df4e3d77b
    with:
      runtime: python
      python-version: "3.12"
      test-command: |
        cd components
        python -m unittest -v test_legendai_stdout_bridge test_legendai_action_guard test_pc_turn_controller test_pc_observation_sequence test_pc_observation_adapter test_pc_state_normalizer test_pc_capture_alignment test_pc_capture_envelope test_pc_live_screen_stream test_pc_window_probe test_pc_postconditions test_pc_phase_evidence test_pc_screen_observer test_pc_window_capture test_pc_target_observer test_pc_action_target_mapping test_pc_action_preview test_pc_action_preview_cli test_observation_replay_report
